name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.test-metrics.outputs.tests_passed }}
      coverage_pct: ${{ steps.test-metrics.outputs.coverage_pct }}
      quality_status: ${{ steps.ruff-status.outputs.quality_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff status
        id: ruff-status
        run: echo "quality_status=passing" >> "$GITHUB_OUTPUT"

      - name: Pytest
        run: |
          set -o pipefail
          uv run pytest --cov=label_sea --cov-report=term-missing | tee pytest.log

      - name: Test metrics
        id: test-metrics
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          log = Path('pytest.log').read_text(encoding='utf-8')
          tests_match = re.search(r'(\d+) passed', log)
          coverage_match = re.search(r'TOTAL\s+\d+\s+\d+\s+(\d+)%', log)
          if not tests_match or not coverage_match:
              raise SystemExit('unable to parse pytest metrics')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"tests_passed={tests_match.group(1)}\n")
              handle.write(f"coverage_pct={coverage_match.group(1)}%\n")
          PY

  supply-chain:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    outputs:
      image_size_mb: ${{ steps.image-meta.outputs.size_mb }}
      sbom_packages: ${{ steps.sbom-metrics.outputs.packages }}
      critical_count: ${{ steps.trivy-metrics.outputs.critical }}
      high_count: ${{ steps.trivy-metrics.outputs.high }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: label-sea:ci

      - name: Collect image metadata
        id: image-meta
        run: |
          image_size_bytes="$(docker image inspect label-sea:ci --format '{{.Size}}')"
          image_size_mb="$((image_size_bytes / 1024 / 1024))"
          echo "size_bytes=${image_size_bytes}" >> "$GITHUB_OUTPUT"
          echo "size_mb=${image_size_mb}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: label-sea:ci
          format: spdx-json
          output-file: label-sea.spdx.json
          upload-artifact: false

      - name: Pretty-print SBOM
        run: |
          python -m json.tool label-sea.spdx.json > label-sea.spdx.pretty.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: label-sea-sbom
          path: |
            label-sea.spdx.json
            label-sea.spdx.pretty.json

      - name: SBOM metrics
        id: sbom-metrics
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sbom = json.loads(Path('label-sea.spdx.json').read_text(encoding='utf-8'))
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"packages={len(sbom.get('packages', []))} packages\n")
          PY

      - name: CVE scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: label-sea:ci
          format: json
          output: trivy-results.json
          exit-code: '0'
          hide-progress: true
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        with:
          name: label-sea-trivy-report
          path: trivy-results.json

      - name: Trivy metrics
        id: trivy-metrics
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('trivy-results.json').read_text(encoding='utf-8'))
          counts = {'CRITICAL': 0, 'HIGH': 0}
          for result in report.get('Results', []):
              for vuln in result.get('Vulnerabilities') or []:
                  severity = vuln.get('Severity')
                  if severity in counts:
                      counts[severity] += 1
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"critical={counts['CRITICAL']}\n")
              handle.write(f"high={counts['HIGH']}\n")
          PY

      - name: Supply-chain summary
        env:
          IMAGE_SIZE_MB: ${{ steps.image-meta.outputs.size_mb }}
          IMAGE_SIZE_BYTES: ${{ steps.image-meta.outputs.size_bytes }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          sbom = json.loads(Path("label-sea.spdx.json").read_text(encoding="utf-8"))
          trivy = json.loads(Path("trivy-results.json").read_text(encoding="utf-8"))

          packages = sbom.get("packages", [])
          files = sbom.get("files", [])
          relationships = sbom.get("relationships", [])

          results = trivy.get("Results", [])
          findings = []
          for result in results:
            target = result.get("Target", "unknown")
            for vuln in result.get("Vulnerabilities") or []:
              findings.append(
                {
                  "target": target,
                  "severity": vuln.get("Severity", "UNKNOWN"),
                  "id": vuln.get("VulnerabilityID", "n/a"),
                  "pkg": vuln.get("PkgName", "n/a"),
                  "installed": vuln.get("InstalledVersion", "n/a"),
                  "fixed": vuln.get("FixedVersion") or "unfixed",
                  "title": (vuln.get("Title") or "").strip(),
                }
              )

          severity_order = ["CRITICAL", "HIGH"]
          severity_counts = {
            severity: sum(1 for finding in findings if finding["severity"] == severity)
            for severity in severity_order
          }
          findings.sort(
            key=lambda finding: (
              severity_order.index(finding["severity"]) if finding["severity"] in severity_order else 99,
              finding["target"],
              finding["pkg"],
            )
          )
          top_findings = findings[:10]

          lines = [
            "## Supply-chain summary",
            "",
            "### Container image",
            "",
            f"- Image: `label-sea:ci`",
            f"- Size: `{os.environ['IMAGE_SIZE_MB']} MB` ({os.environ['IMAGE_SIZE_BYTES']} bytes)",
            "",
            "### SBOM",
            "",
            f"- Packages: `{len(packages)}`",
            f"- Files: `{len(files)}`",
            f"- Relationships: `{len(relationships)}`",
            "",
            "### Vulnerability summary",
            "",
            f"- Critical: `{severity_counts['CRITICAL']}`",
            f"- High: `{severity_counts['HIGH']}`",
          ]

          if top_findings:
            lines.extend(
              [
                "",
                "### Top findings",
                "",
                "| Severity | Package | Installed | Fixed | Vulnerability | Target |",
                "| --- | --- | --- | --- | --- | --- |",
              ]
            )
            for finding in top_findings:
              lines.append(
                "| {severity} | {pkg} | {installed} | {fixed} | {vuln} | {target} |".format(
                  severity=finding["severity"],
                  pkg=finding["pkg"],
                  installed=finding["installed"],
                  fixed=finding["fixed"],
                  vuln=finding["id"],
                  target=finding["target"],
                )
              )
          else:
            lines.extend(["", "No HIGH or CRITICAL findings reported by Trivy."])

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

  badges:
    runs-on: ubuntu-latest
    needs:
      - test
      - supply-chain
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate badge files
        run: |
          python scripts/write_badges.py \
            --output-dir badge-data \
            --tests "${{ needs.test.outputs.tests_passed && format('{0} passing', needs.test.outputs.tests_passed) || 'unknown' }}" \
            --coverage "${{ needs.test.outputs.coverage_pct || 'unknown' }}" \
            --quality "${{ needs.test.outputs.quality_status || 'unknown' }}" \
            --image-size "${{ needs.supply-chain.outputs.image_size_mb && format('{0} MB', needs.supply-chain.outputs.image_size_mb) || 'unknown' }}" \
            --sbom-packages "${{ needs.supply-chain.outputs.sbom_packages || 'unknown' }}" \
            --critical "${{ needs.supply-chain.outputs.critical_count || 'unknown' }}" \
            --high "${{ needs.supply-chain.outputs.high_count || 'unknown' }}"

      - name: Publish badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd badge-data
          git init -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "Update badge data" || exit 0
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin badges
