name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest --cov=label_sea --cov-report=term-missing

  supply-chain:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: label-sea:ci

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: label-sea:ci
          format: spdx-json
          output-file: label-sea.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: label-sea-sbom
          path: label-sea.spdx.json

      - name: CVE scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: label-sea:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
